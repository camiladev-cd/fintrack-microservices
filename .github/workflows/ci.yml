name: FinTrack CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fintrack_user
          POSTGRES_PASSWORD: fintrack_pass
          POSTGRES_DB: fintrack_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn compile -q

      - name: Run tests
        run: mvn test -pl auth-service

      - name: Package all services
        run: mvn package -DskipTests -q

      - name: Upload auth-service artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service
          path: auth-service/target/*.jar

      - name: Upload gateway artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway
          path: api-gateway/target/*.jar

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api-gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fintrack-api-gateway:latest

      - name: Build and push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: auth-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fintrack-auth-service:latest