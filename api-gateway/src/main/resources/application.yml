server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # ── Auth Service ─────────────────────────────────────────
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # ── User Service ─────────────────────────────────────────
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        # ── Wallet Service ───────────────────────────────────────
        - id: wallet-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/wallets/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        # ── Transaction Service ──────────────────────────────────
        - id: transaction-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/transactions/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

# ── JWT ───────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:default_secret_change_in_production_min_32_chars!!}

# ── Actuator ──────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: DEBUG